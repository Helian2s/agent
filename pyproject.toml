[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-langgraph-agent"
version = "0.1.0"
description = "Minimal LangGraph starter that calls Amazon Bedrock Converse."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34.0",
  "langgraph>=0.2.0",
  "pytest>=8.3.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "selenium>=4.21.0",
]

[project.scripts]
bedrock-langgraph-agent = "bedrock_langgraph_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
